<!doctype html>
<html lang="en">

  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:ital,wght@0,400;0,700;1,700&family=Fredoka:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>

      darkMode: "class",

            "ink-dark": "#0c0a09",
            "primary": "#d97706",
            "primary-container": "#b45309",
            "primary-light": "#fef3c7",
            "primary-subtle": "#fffbeb",
            "surface": "#faf8f5",
            "surface-card": "#ffffff",
            "surface-alt": "#fef7ee",

            "comicPurple": "#9a3412",

            "outline": "#a8a29e",

            '2.5': '2.5px',
            '3': '3px',

            "headline": ["Plus Jakarta Sans", "sans-serif"],
            "body": ["Inter", "sans-serif"],

<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Register - Quizzo Comic Hero League</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<!-- Comic Pop Fonts: Bangers for Action/Headlines, Fredoka & Comic Neue for Crisp Comic Text -->
<link href="https://fonts.googleapis.com/css2?family=Bangers&amp;family=Comic+Neue:wght@400;700&amp;family=Fredoka:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
    @layer base {
      html, body {
        margin: 0;
        padding: 0;
      }
      body {
        overscroll-behavior: none;
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }

    /* Comic Ben-Day / Halftone Pattern */
    .comic-halftone {
      background-image: radial-gradient(#1e1b4b 18%, transparent 19%), radial-gradient(#1e1b4b 18%, transparent 19%);
      background-size: 16px 16px;
      background-position: 0 0, 8px 8px;
      opacity: 0.08;
    }
    .comic-halftone-dense {
      background-image: radial-gradient(#1e1b4b 22%, transparent 23%);
      background-size: 12px 12px;
      opacity: 0.09;
    }

    /* Pop Neo-Brutal Comic Shadows */
    .comic-box-shadow {
      box-shadow: 8px 8px 0px #1e1b4b;
    }
    .comic-card-shadow {
      box-shadow: 5px 5px 0px #1e1b4b;
    }
    .comic-badge-shadow {
      box-shadow: 3px 3px 0px #1e1b4b;
    }
    .comic-btn-shadow {
      box-shadow: 0 5px 0px #1e1b4b;
    }
    .comic-btn-shadow:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 0px #1e1b4b;
    }
    .comic-btn-shadow:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0px #1e1b4b;
    }

    /* Speech Bubble Tail for Mascot */
    .mascot-bubble::after {
      content: '';
      position: absolute;
      bottom: -11px;
      left: 28px;
      border-width: 12px 12px 0 0;
      border-style: solid;
      border-color: #ffffff transparent transparent transparent;
      display: block;
      width: 0;
    }
    .mascot-bubble::before {
      content: '';
      position: absolute;
      bottom: -15px;
      left: 26px;
      border-width: 15px 15px 0 0;
      border-style: solid;
      border-color: #1e1b4b transparent transparent transparent;
      display: block;
      width: 0;
    }
  </style>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-container": "#eaedff",
            "on-tertiary-fixed": "#2a1700",
            "on-primary-fixed": "#0f0069",
            "surface": "#faf8ff",
            "secondary-fixed-dim": "#adc6ff",
            "inverse-primary": "#c3c0ff",
            "inverse-surface": "#283044",
            "on-primary-fixed-variant": "#3323cc",
            "on-error": "#ffffff",
            "on-error-container": "#93000a",
            "on-secondary-fixed": "#001a42",
            "on-background": "#131b2e",
            "primary-fixed-dim": "#c3c0ff",
            "on-tertiary-fixed-variant": "#653e00",
            "on-secondary-container": "#fefcff",
            "tertiary-fixed": "#ffddb8",
            "surface-container-lowest": "#ffffff",
            "surface-dim": "#d2d9f4",
            "on-tertiary-container": "#ffd4a4",
            "on-primary": "#ffffff",
            "inverse-on-surface": "#eef0ff",
            "surface-container-low": "#f2f3ff",
            "surface-variant": "#dae2fd",
            "surface-bright": "#faf8ff",
            "primary": "#3525cd",
            "on-surface": "#131b2e",
            "on-secondary-fixed-variant": "#004395",
            "outline-variant": "#c7c4d8",
            "outline": "#777587",
            "secondary-container": "#2170e4",
            "tertiary-fixed-dim": "#ffb95f",
            "error-container": "#ffdad6",
            "surface-container-high": "#e2e7ff",
            "on-surface-variant": "#464555",
            "tertiary": "#684000",
            "background": "#faf8ff",
            "tertiary-container": "#885500",
            "secondary-fixed": "#d8e2ff",
            "on-tertiary": "#ffffff",
            "primary-container": "#4f46e5",
            "surface-container-highest": "#dae2fd",
            "on-primary-container": "#dad7ff",
            "surface-tint": "#4d44e3",
            "primary-fixed": "#e2dfff",
            "on-secondary": "#ffffff",
            "secondary": "#0058be",
            "error": "#ba1a1a"
          },
          fontFamily: {
            comic: ['"Comic Neue"', 'cursive', 'sans-serif'],
            pop: ['"Fredoka"', 'sans-serif'],
            action: ['"Bangers"', 'cursive', 'system-ui'],
            headline: ['"Bangers"', 'cursive']
          }
        }
      }
    };
  </script>
</head>
<body class="bg-[#f0f3fc] text-[#131b2e] min-h-screen flex flex-col justify-between font-pop selection:bg-[#ec4899] selection:text-white relative overflow-x-hidden">
<!-- Halftone Pattern Background -->
<div class="comic-halftone fixed inset-0 pointer-events-none z-0"></div>
<!-- Floating Comic Action Callouts & Ambient Decor -->
<div class="fixed top-8 left-8 hidden lg:block z-0 pointer-events-none select-none -rotate-12">
<div class="bg-yellow-300 border-[3px] border-[#1e1b4b] font-action text-2xl tracking-wider text-[#1e1b4b] px-4 py-1.5 rounded-2xl comic-card-shadow animate-pulse">
    ⚡ KAPOW!
  </div>
</div>
<div class="fixed bottom-12 left-10 hidden lg:block z-0 pointer-events-none select-none rotate-6">
<div class="bg-[#22d3ee] border-[3px] border-[#1e1b4b] font-action text-xl tracking-wider text-[#1e1b4b] px-3.5 py-1 rounded-xl comic-card-shadow">
    ★ 100% FREE!
  </div>
</div>
<div class="fixed top-14 right-10 hidden lg:block z-0 pointer-events-none select-none rotate-12">
<div class="bg-[#ec4899] border-[3px] border-[#1e1b4b] font-action text-xl tracking-wider text-white px-4 py-1.5 rounded-2xl comic-card-shadow">
    🔥 BRAIN POWER!
  </div>
</div>
<div class="fixed bottom-16 right-12 hidden lg:block z-0 pointer-events-none select-none -rotate-6">
<div class="bg-[#a855f7] border-[3px] border-[#1e1b4b] font-action text-lg tracking-wider text-white px-3.5 py-1 rounded-xl comic-card-shadow">
    🏆 TOP RANKED
  </div>
</div>
<!-- Top Navigation / Brand Tagline -->
<header class="w-full z-20 pt-4 pb-2 px-4 flex justify-center">

</header>
<main class="w-full flex-1 flex items-center justify-center px-4 sm:px-6 py-6 lg:py-8 z-10 relative">
<!-- CENTERED COMIC HERO REGISTER CARD -->
<div class="w-full max-w-2xl bg-surface-container-lowest rounded-3xl border-[3.5px] border-[#1e1b4b] comic-box-shadow relative pt-12 sm:pt-14 pb-8 px-5 sm:px-8 md:px-10 mt-10 sm:mt-12">
<!-- PEEKING COMIC MASCOT + SPEECH BUBBLE -->
<div class="absolute -top-14 sm:-top-16 left-1/2 -translate-x-1/2 flex items-end gap-3 pointer-events-none select-none z-30">
<!-- Mascot Speech Bubble -->
<div class="mascot-bubble relative bg-white border-[2.5px] border-[#1e1b4b] rounded-xl px-3 py-1.5 comic-badge-shadow mb-8 sm:mb-9 -rotate-3 pointer-events-auto">
<span class="font-action text-xs sm:text-sm tracking-wide text-[#3525cd] whitespace-nowrap">
          WELCOME, FUTURE CHAMPION! ⚡
        </span>
</div>
<!-- Cute Comic Superhero Study Orb Mascot -->
<div class="relative w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-white border-[3.5px] border-[#1e1b4b] comic-card-shadow flex items-center justify-center pointer-events-auto group hover:scale-105 transition-transform duration-200">
<div class="w-full h-full rounded-full bg-gradient-to-tr from-[#3b2db5] via-[#4f46e5] to-[#22d3ee] flex flex-col items-center justify-center relative overflow-hidden border-2 border-white">
<!-- Mascot Action Eyes -->
<div class="flex items-center gap-2 mb-0.5 z-10">
<div class="w-3 h-3 rounded-full bg-white flex items-center justify-center border border-[#1e1b4b]">
<div class="w-1.5 h-1.5 rounded-full bg-[#1e1b4b]"></div>
</div>
<div class="w-3 h-3 rounded-full bg-white flex items-center justify-center border border-[#1e1b4b]">
<div class="w-1.5 h-1.5 rounded-full bg-[#1e1b4b]"></div>
</div>
</div>
<!-- Big Comic 'Q' Mascot Monogram -->
<span class="text-white font-action text-3xl sm:text-4xl tracking-tight leading-none drop-shadow-[2px_2px_0px_#1e1b4b] select-none">
            Q
          </span>
<!-- Mini Speed Rays in Badge -->
<div class="absolute -right-1 top-1 text-white/40 font-action text-[10px] rotate-45 select-none">///</div>
</div>
<!-- Super Cape Accent Badge -->
<div class="absolute -bottom-1 -right-2 bg-yellow-400 border-2 border-[#1e1b4b] text-[#1e1b4b] text-[9px] font-action px-1.5 py-0.5 rounded shadow-[1.5px_1.5px_0px_#1e1b4b] rotate-12">
          NEW!
        </div>
</div>
</div>
<!-- CARD HEADER TITLE & BADGE -->
<div class="text-center mt-2 mb-5">
<div class="inline-flex items-center gap-2 mb-1.5">


</div>
<h1 class="font-action text-3xl sm:text-4xl md:text-5xl text-[#1e1b4b] tracking-wide leading-tight drop-shadow-[2px_2px_0px_#adc6ff]">
        CREATE YOUR ACCOUNT
      </h1>
<p class="font-comic font-bold text-xs sm:text-sm text-[#464555] max-w-md mx-auto mt-0.5">
        Begin your quiz master quest!
      </p>
</div>
<!-- SOCIAL QUICK SIGN-UP -->
<div class="mb-5">
<button class="w-full h-12 py-2 px-4 rounded-2xl border-[3px] border-[#1e1b4b] bg-white hover:bg-surface-container-low active:bg-surface-container text-[#131b2e] font-comic font-bold text-sm sm:text-base flex items-center justify-center gap-3 comic-btn-shadow transition-all group cursor-pointer" type="button">
<svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3.03h3.88c2.27-2.09 3.66-5.17 3.66-9.12z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.03c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.13C3.26 21.39 7.33 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.29c-.25-.72-.38-1.49-.38-2.29s.13-1.57.38-2.29V6.58H1.25C.45 8.17 0 9.99 0 12s.45 3.83 1.25 5.42l4.03-3.13z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.61 1.25 6.58l4.03 3.13c.95-2.83 3.6-4.96 6.72-4.96z" fill="#EA4335"></path>
</svg>
<span class="group-hover:text-primary transition-colors">
          Sign up with Google
        </span>
</button>
<!-- COMIC SECTION DIVIDER -->
<div class="relative my-4 text-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t-[2.5px] border-dashed border-[#1e1b4b]/40"></div>
</div>
<span class="relative bg-surface-container-lowest px-3 font-action text-xs sm:text-sm tracking-wider text-[#464555] uppercase">
          ★ OR ENTER RECRUIT DETAILS ★
        </span>
</div>
</div>
<!-- REGISTRATION FORM (HIGH DENSITY 7 FIELDS) -->
<form class="space-y-3.5 bg-[#faf8ff] border-[2.5px] border-[#1e1b4b] rounded-2xl p-4 sm:p-5 comic-card-shadow" onsubmit="event.preventDefault();">
<!-- ROW 1: FIRST NAME & LAST NAME -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
<!-- Field 1: First Name -->
<div>
<label class="block font-comic font-bold text-xs uppercase tracking-wide text-[#1e1b4b] mb-1" for="firstName">
            First Name <span class="text-error font-bold">*</span>
</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#1e1b4b] text-[18px]">badge</span>
<input class="w-full h-10 pl-9 pr-3 rounded-xl bg-white border-[2px] border-[#1e1b4b] text-[#131b2e] placeholder:text-outline font-comic text-sm transition-all focus:outline-none focus:ring-2 focus:ring-primary shadow-inner" id="firstName" placeholder="Alex" required="" type="text">
</div>
</div>
<!-- Field 2: Last Name -->
<div>
<label class="block font-comic font-bold text-xs uppercase tracking-wide text-[#1e1b4b] mb-1" for="lastName">
            Last Name <span class="text-error font-bold">*</span>
</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#1e1b4b] text-[18px]">person</span>
<input class="w-full h-10 pl-9 pr-3 rounded-xl bg-white border-[2px] border-[#1e1b4b] text-[#131b2e] placeholder:text-outline font-comic text-sm transition-all focus:outline-none focus:ring-2 focus:ring-primary shadow-inner" id="lastName" placeholder="Rider" required="" type="text">
</div>
</div>
</div>
<!-- ROW 2: USERNAME & PHONE NUMBER -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
<!-- Field 3: Username -->
<div>
<label class="block font-comic font-bold text-xs uppercase tracking-wide text-[#1e1b4b] mb-1" for="username">
            Username <span class="text-error font-bold">*</span>
</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#1e1b4b] text-[18px]">alternate_email</span>
<input class="w-full h-10 pl-9 pr-3 rounded-xl bg-white border-[2px] border-[#1e1b4b] text-[#131b2e] placeholder:text-outline font-comic text-sm transition-all focus:outline-none focus:ring-2 focus:ring-primary shadow-inner" id="username" placeholder="quiz_champion_99" required="" type="text">
</div>
</div>
<!-- Field 4: Phone Number -->
<div>
<label class="block font-comic font-bold text-xs uppercase tracking-wide text-[#1e1b4b] mb-1" for="phone">
            Phone Number <span class="text-error font-bold">*</span>
</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#1e1b4b] text-[18px]">call</span>
<input class="w-full h-10 pl-9 pr-3 rounded-xl bg-white border-[2px] border-[#1e1b4b] text-[#131b2e] placeholder:text-outline font-comic text-sm transition-all focus:outline-none focus:ring-2 focus:ring-primary shadow-inner" id="phone" placeholder="+1 (555) 019-2834" required="" type="tel">
</div>
</div>
</div>
<!-- ROW 3: EMAIL ADDRESS (FULL WIDTH) -->
<div>
<label class="block font-comic font-bold text-xs uppercase tracking-wide text-[#1e1b4b] mb-1" for="email">
          Email Address <span class="text-error font-bold">*</span>
</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#1e1b4b] text-[18px]">mail</span>
<input class="w-full h-10 pl-9 pr-3 rounded-xl bg-white border-[2px] border-[#1e1b4b] text-[#131b2e] placeholder:text-outline font-comic text-sm transition-all focus:outline-none focus:ring-2 focus:ring-primary shadow-inner" id="email" placeholder="alex.rider@heroacademy.edu" required="" type="email">
</div>
</div>
<!-- ROW 4: PASSWORD & CONFIRM PASSWORD -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
<!-- Field 6: Password -->
<div>
<label class="block font-comic font-bold text-xs uppercase tracking-wide text-[#1e1b4b] mb-1" for="regPassword">
            Password <span class="text-error font-bold">*</span>
</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#1e1b4b] text-[18px]">lock</span>
<input class="w-full h-10 pl-9 pr-9 rounded-xl bg-white border-[2px] border-[#1e1b4b] text-[#131b2e] placeholder:text-outline font-comic text-sm transition-all focus:outline-none focus:ring-2 focus:ring-primary shadow-inner" id="regPassword" placeholder="••••••••••••" required="" type="password" value="SuperSecret2025!">
<button aria-label="Toggle password visibility" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[#1e1b4b] hover:text-primary transition-colors cursor-pointer" onclick="const p = document.getElementById('regPassword'); const isP = p.type === 'password'; p.type = isP ? 'text' : 'password'; this.querySelector('span').textContent = isP ? 'visibility_off' : 'visibility';" type="button">
<span class="material-symbols-outlined text-[17px]">visibility</span>
</button>
</div>
</div>
<!-- Field 7: Confirm Password -->
<div>
<label class="block font-comic font-bold text-xs uppercase tracking-wide text-[#1e1b4b] mb-1" for="confirmPassword">
            Confirm Password <span class="text-error font-bold">*</span>
</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#1e1b4b] text-[18px]">lock_reset</span>
<input class="w-full h-10 pl-9 pr-9 rounded-xl bg-white border-[2px] border-[#1e1b4b] text-[#131b2e] placeholder:text-outline font-comic text-sm transition-all focus:outline-none focus:ring-2 focus:ring-primary shadow-inner" id="confirmPassword" placeholder="••••••••••••" required="" type="password" value="SuperSecret2025!">
<button aria-label="Toggle confirm password visibility" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[#1e1b4b] hover:text-primary transition-colors cursor-pointer" onclick="const p = document.getElementById('confirmPassword'); const isP = p.type === 'password'; p.type = isP ? 'text' : 'password'; this.querySelector('span').textContent = isP ? 'visibility_off' : 'visibility';" type="button">
<span class="material-symbols-outlined text-[17px]">visibility</span>
</button>
</div>
</div>
</div>
<!-- Password Strength Indicator Meter -->

<!-- TERMS & CONDITIONS CHECKBOX -->
<div class="pt-1.5 flex items-start gap-2.5">
<input checked="" class="mt-0.5 w-4 h-4 rounded-md border-2 border-[#1e1b4b] text-primary focus:ring-primary cursor-pointer accent-[#3525cd]" id="terms" required="" type="checkbox" placeholder="on" value="">
<label class="font-comic text-xs text-[#131b2e] leading-snug cursor-pointer select-none" for="terms">
          I agree to the <a class="font-bold underline text-primary hover:text-primary-container transition-colors" href="#">Privacy Policy</a>.
        </label>
</div>
<!-- PUNCHY CTA SUBMIT BUTTON -->
<button class="w-full h-13 mt-2 py-3 px-4 rounded-2xl bg-gradient-to-r from-[#3525cd] via-[#4f46e5] to-[#22d3ee] text-white font-action tracking-wider text-lg sm:text-xl flex items-center justify-center gap-2 border-[3px] border-[#1e1b4b] comic-btn-shadow transition-all cursor-pointer group" type="submit">
<span class="drop-shadow-[1px_1px_0px_#1e1b4b]">REGISTER</span>
<span class="text-2xl group-hover:scale-125 group-hover:rotate-12 transition-transform">💥</span>
</button>
</form>
<!-- CARD FOOTER: ALREADY A MEMBER LOGIN LINK -->
<div class="mt-5 pt-4 text-center border-t-[2px] border-dashed border-[#1e1b4b]/30">
<p class="font-comic font-bold text-xs sm:text-sm text-[#131b2e] flex items-center justify-center gap-1.5 flex-wrap">
<span class="">★ Already a member of the Quizzo?</span>
<a class="inline-flex items-center gap-1 bg-[#ffddb8] text-primary border-[2px] border-[#1e1b4b] px-2.5 py-0.5 rounded-xl font-action tracking-wide text-xs sm:text-sm shadow-[2px_2px_0px_#1e1b4b] hover:scale-105 active:scale-95 transition-all" href="#">
<span class="">Log In here</span>
<span class="material-symbols-outlined text-[15px]">arrow_forward</span>
</a>
<span class="">★</span>
</p>
</div>
</div>
</main>



</body></html>

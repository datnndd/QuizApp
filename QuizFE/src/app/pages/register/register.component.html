<div class="relative w-full max-w-2xl mx-auto select-none" data-purpose="register-modal-card">
  <!-- Top Bar: Peeking Mascot + Speech Bubble + Close Button -->
  <div class="relative w-full flex items-end justify-between px-4 sm:px-6 -mb-6 z-20 pointer-events-none">
    <!-- Left Logo + Speech Bubble -->
    <div class="flex items-center gap-2.5 pointer-events-auto group">
      <div
        class="w-11 h-11 rounded-2xl bg-amber-600 flex items-center justify-center shadow-tactile border-2 border-[#272421] relative group-hover:scale-105 transition-transform">
        <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 32 32">
          <rect fill="white" height="18" rx="8" stroke="#272421" stroke-width="2" width="22" x="5" y="9"></rect>
          <circle cx="11" cy="17" fill="#272421" r="2.5"></circle>
          <circle cx="21" cy="17" fill="#272421" r="2.5"></circle>
          <path d="M13 21C14 22.5 18 22.5 19 21" stroke="#272421" stroke-linecap="round" stroke-width="2"></path>
          <path d="M16 4V9" stroke="#272421" stroke-linecap="round" stroke-width="2"></path>
          <circle cx="16" cy="4" fill="#fef08a" r="2.5" stroke="#272421" stroke-width="1.5"></circle>
          <circle cx="8" cy="19" fill="#f87171" opacity="0.6" r="1.5"></circle>
          <circle cx="24" cy="19" fill="#f87171" opacity="0.6" r="1.5"></circle>
        </svg>
      </div>

      <!-- Mascot Speech Bubble -->
      <div
        class="mascot-bubble relative bg-amber-50 border-[2.5px] border-[#292524] rounded-xl px-3 py-1.5 comic-shadow-badge mb-3 -rotate-2 pointer-events-auto">
        <span class="font-action text-xs tracking-wide text-amber-700 whitespace-nowrap">
          WELCOME, FUTURE CHAMPION! ⚡
        </span>
      </div>
    </div>

    <!-- Right: Close Button -->
    <button
      type="button"
      (click)="closeModal.emit()"
      class="pointer-events-auto mb-2 w-10 h-10 rounded-2xl bg-[#fffcf7] hover:bg-amber-100 active:bg-amber-200 border-2 border-[#272421] shadow-tactile flex items-center justify-center text-[#1e1b18] hover:rotate-90 transition-all cursor-pointer"
      aria-label="Close modal">
      <span class="material-symbols-outlined text-xl font-bold">close</span>
    </button>
  </div>

  <!-- Card Body -->
  <div
    class="w-full bg-[#fffdfa] rounded-3xl border-[3.5px] border-[#292524] comic-shadow-box relative pt-9 pb-6 px-5 sm:px-8">
    <div class="text-center mt-1 mb-4">
      <h1
        class="font-action text-2xl sm:text-3xl md:text-4xl text-stone-900 tracking-wide leading-tight drop-shadow-[2px_2px_0px_#fed7aa]">
        CREATE YOUR ACCOUNT
      </h1>
      <p class="font-comic font-bold text-xs text-stone-600 max-w-md mx-auto mt-0.5">
        Begin your quiz master quest!
      </p>
    </div>

    <!-- Social Sign Up -->
    <div class="mb-4">
      <button
        class="w-full h-11 py-2 px-4 rounded-xl border-[2.5px] border-[#292524] bg-[#fffcf7] hover:bg-amber-50 active:bg-amber-100 text-stone-900 font-comic font-bold text-xs sm:text-sm flex items-center justify-center gap-2.5 comic-shadow-btn transition-all group cursor-pointer"
        type="button">
        <svg class="w-4.5 h-4.5 shrink-0" viewBox="0 0 24 24">
          <path
            d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3.03h3.88c2.27-2.09 3.66-5.17 3.66-9.12z"
            fill="#4285F4"></path>
          <path
            d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.03c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.13C3.26 21.39 7.33 24 12 24z"
            fill="#34A853"></path>
          <path
            d="M5.28 14.29c-.25-.72-.38-1.49-.38-2.29s.13-1.57.38-2.29V6.58H1.25C.45 8.17 0 9.99 0 12s.45 3.83 1.25 5.42l4.03-3.13z"
            fill="#FBBC05"></path>
          <path
            d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.61 1.25 6.58l4.03 3.13c.95-2.83 3.6-4.96 6.72-4.96z"
            fill="#EA4335"></path>
        </svg>
        <span class="group-hover:text-amber-700 transition-colors">Sign up with Google</span>
      </button>

      <!-- Section Divider -->
      <div class="relative my-3 text-center">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t-[2px] border-dashed border-amber-200"></div>
        </div>
        <span class="relative bg-[#fffdfa] px-3 font-action text-xs tracking-wider text-amber-800 uppercase">
          ★ OR ENTER RECRUIT DETAILS ★
        </span>
      </div>
    </div>

    <!-- Registration Form -->
    <form class="space-y-3 bg-[#faf8f5] border-[2px] border-[#292524] rounded-2xl p-3.5 sm:p-4 comic-card-shadow" (ngSubmit)="onSubmit()">
      @if (errorMessage()) {
        <div class="p-2.5 bg-orange-50 border-2 border-orange-500 rounded-xl text-orange-900 font-comic text-xs font-bold flex items-center gap-2 shadow-xs">
          <span class="text-base">⚠️</span>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <!-- Row 1: First Name & Last Name -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
        <div>
          <label class="block font-comic font-bold text-xs uppercase tracking-wide text-[#292524] mb-1" for="firstName">
            First Name <span class="text-orange-600 font-bold">*</span>
          </label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-stone-400 text-[18px]">badge</span>
            <input
              class="w-full h-9 pl-9 pr-3 rounded-xl bg-white border-[2px] border-[#292524] text-stone-900 placeholder:text-stone-400 font-comic text-xs sm:text-sm transition-all focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-inner"
              id="firstName"
              name="firstName"
              placeholder="Alex"
              required
              type="text"
              [value]="firstName()"
              (input)="firstName.set($any($event.target).value)"
            />
          </div>
        </div>
        <div>
          <label class="block font-comic font-bold text-xs uppercase tracking-wide text-[#292524] mb-1" for="lastName">
            Last Name <span class="text-orange-600 font-bold">*</span>
          </label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-stone-400 text-[18px]">person</span>
            <input
              class="w-full h-9 pl-9 pr-3 rounded-xl bg-white border-[2px] border-[#292524] text-stone-900 placeholder:text-stone-400 font-comic text-xs sm:text-sm transition-all focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-inner"
              id="lastName"
              name="lastName"
              placeholder="Rider"
              required
              type="text"
              [value]="lastName()"
              (input)="lastName.set($any($event.target).value)"
            />
          </div>
        </div>
      </div>

      <!-- Row 2: Username & Phone Number -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
        <div>
          <label class="block font-comic font-bold text-xs uppercase tracking-wide text-[#292524] mb-1" for="username">
            Username <span class="text-orange-600 font-bold">*</span>
          </label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-stone-400 text-[18px]">alternate_email</span>
            <input
              class="w-full h-9 pl-9 pr-3 rounded-xl bg-white border-[2px] border-[#292524] text-stone-900 placeholder:text-stone-400 font-comic text-xs sm:text-sm transition-all focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-inner"
              id="username"
              name="username"
              placeholder="quiz_champion_99"
              required
              type="text"
              [value]="username()"
              (input)="username.set($any($event.target).value)"
            />
          </div>
        </div>
        <div>
          <label class="block font-comic font-bold text-xs uppercase tracking-wide text-[#292524] mb-1" for="phone">
            Phone Number <span class="text-orange-600 font-bold">*</span>
          </label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-stone-400 text-[18px]">call</span>
            <input
              class="w-full h-9 pl-9 pr-3 rounded-xl bg-white border-[2px] border-[#292524] text-stone-900 placeholder:text-stone-400 font-comic text-xs sm:text-sm transition-all focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-inner"
              id="phone"
              name="phone"
              placeholder="+1 (555) 019-2834"
              required
              type="tel"
              [value]="phone()"
              (input)="phone.set($any($event.target).value)"
            />
          </div>
        </div>
      </div>

      <!-- Row 3: Email Address -->
      <div>
        <label class="block font-comic font-bold text-xs uppercase tracking-wide text-[#292524] mb-1" for="email">
          Email Address <span class="text-orange-600 font-bold">*</span>
        </label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-stone-400 text-[18px]">mail</span>
          <input
            class="w-full h-9 pl-9 pr-3 rounded-xl bg-white border-[2px] border-[#292524] text-stone-900 placeholder:text-stone-400 font-comic text-xs sm:text-sm transition-all focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-inner"
            id="email"
            name="email"
            placeholder="alex.rider@heroacademy.edu"
            required
            type="email"
            [value]="email()"
            (input)="email.set($any($event.target).value)"
          />
        </div>
      </div>

      <!-- Row 4: Password & Confirm Password -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
        <div>
          <label class="block font-comic font-bold text-xs uppercase tracking-wide text-[#292524] mb-1" for="regPassword">
            Password <span class="text-orange-600 font-bold">*</span>
          </label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-stone-400 text-[18px]">lock</span>
            <input
              class="w-full h-9 pl-9 pr-8 rounded-xl bg-white border-[2px] border-[#292524] text-stone-900 placeholder:text-stone-400 font-comic text-xs sm:text-sm transition-all focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-inner"
              id="regPassword"
              name="password"
              placeholder="••••••••••••"
              required
              [type]="showPassword() ? 'text' : 'password'"
              [value]="password()"
              (input)="password.set($any($event.target).value)"
            />
            <button
              aria-label="Toggle password visibility"
              class="absolute right-2.5 top-1/2 -translate-y-1/2 text-stone-400 hover:text-amber-700 transition-colors cursor-pointer"
              type="button"
              (click)="togglePassword()">
              <span class="material-symbols-outlined text-[17px]">
                {{ showPassword() ? 'visibility_off' : 'visibility' }}
              </span>
            </button>
          </div>
        </div>
        <div>
          <label class="block font-comic font-bold text-xs uppercase tracking-wide text-[#292524] mb-1" for="confirmPassword">
            Confirm Password <span class="text-orange-600 font-bold">*</span>
          </label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-stone-400 text-[18px]">lock_reset</span>
            <input
              class="w-full h-9 pl-9 pr-8 rounded-xl bg-white border-[2px] border-[#292524] text-stone-900 placeholder:text-stone-400 font-comic text-xs sm:text-sm transition-all focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-inner"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="••••••••••••"
              required
              [type]="showConfirmPassword() ? 'text' : 'password'"
              [value]="confirmPassword()"
              (input)="confirmPassword.set($any($event.target).value)"
            />
            <button
              aria-label="Toggle confirm password visibility"
              class="absolute right-2.5 top-1/2 -translate-y-1/2 text-stone-400 hover:text-amber-700 transition-colors cursor-pointer"
              type="button"
              (click)="toggleConfirmPassword()">
              <span class="material-symbols-outlined text-[17px]">
                {{ showConfirmPassword() ? 'visibility_off' : 'visibility' }}
              </span>
            </button>
          </div>
        </div>
      </div>

      <!-- Terms Checkbox -->
      <div class="pt-1 flex items-start gap-2">
        <input
          class="mt-0.5 w-4 h-4 rounded border-2 border-[#292524] text-amber-600 focus:ring-amber-500 cursor-pointer accent-[#d97706]"
          id="terms"
          name="terms"
          required
          type="checkbox"
          [checked]="agreeTerms()"
          (change)="agreeTerms.set($any($event.target).checked)"
        />
        <label class="font-comic text-xs text-stone-900 leading-snug cursor-pointer select-none" for="terms">
          I agree to the <a class="font-bold underline text-amber-700 hover:text-amber-900 transition-colors" href="#">Privacy Policy</a>.
        </label>
      </div>

      <!-- Submit Button -->
      <button
        class="w-full h-12 mt-1 py-2 px-4 rounded-2xl bg-gradient-to-r from-orange-600 via-amber-600 to-amber-500 text-white font-action tracking-wider text-base sm:text-lg flex items-center justify-center gap-2 border-[3px] border-[#292524] comic-shadow-btn transition-all cursor-pointer group disabled:opacity-60 disabled:cursor-not-allowed"
        [disabled]="isLoading()"
        type="submit">
        @if (isLoading()) {
          <span class="drop-shadow-[1px_1px_0px_#292524]">ENLISTING RECRUIT...</span>
        } @else {
          <span class="drop-shadow-[1px_1px_0px_#292524]">REGISTER</span>
          <span class="text-xl group-hover:scale-125 group-hover:rotate-12 transition-transform">💥</span>
        }
      </button>
    </form>

    <!-- Switch to Login -->
    <div class="mt-4 pt-3 text-center border-t-[2px] border-dashed border-[#292524]/20">
      <p class="font-comic font-bold text-xs text-stone-900 flex items-center justify-center gap-1.5 flex-wrap">
        <span>★ Already a member of Quizzo?</span>
        <button
          type="button"
          (click)="switchToLogin.emit()"
          class="inline-flex items-center gap-1 bg-amber-100 hover:bg-amber-200 text-amber-950 border-[2px] border-[#292524] px-2.5 py-0.5 rounded-xl font-action tracking-wide text-xs shadow-[2px_2px_0px_#292524] hover:scale-105 active:scale-95 transition-all cursor-pointer">
          <span>Log In here</span>
          <span class="material-symbols-outlined text-[14px]">arrow_forward</span>
        </button>
        <span>★</span>
      </p>
    </div>
  </div>
</div>

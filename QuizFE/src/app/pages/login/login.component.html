<div class="relative w-full max-w-[540px] mx-auto select-none" data-purpose="login-modal-card">
  <!-- Top Bar: Mascot with Speech Bubble + Close Button -->
  <div class="relative w-full flex items-end justify-between px-4 sm:px-6 -mb-6 z-20 pointer-events-none">
    <!-- Left Logo + Speech Bubble -->
    <div class="flex items-center gap-2.5 pointer-events-auto group">
      <div
        class="w-11 h-11 rounded-2xl bg-amber-600 flex items-center justify-center shadow-tactile border-2 border-[#272421] relative group-hover:scale-105 transition-transform">
        <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 32 32">
          <rect fill="white" height="18" rx="8" stroke="#272421" stroke-width="2" width="22" x="5" y="9"></rect>
          <circle cx="11" cy="17" fill="#272421" r="2.5"></circle>
          <circle cx="21" cy="17" fill="#272421" r="2.5"></circle>
          <path d="M13 21C14 22.5 18 22.5 19 21" stroke="#272421" stroke-linecap="round" stroke-width="2"></path>
          <path d="M16 4V9" stroke="#272421" stroke-linecap="round" stroke-width="2"></path>
          <circle cx="16" cy="4" fill="#fef08a" r="2.5" stroke="#272421" stroke-width="1.5"></circle>
          <circle cx="8" cy="19" fill="#f87171" opacity="0.6" r="1.5"></circle>
          <circle cx="24" cy="19" fill="#f87171" opacity="0.6" r="1.5"></circle>
        </svg>
      </div>

      <!-- Speech Bubble -->
      <div
        class="bg-amber-50 comic-border-thick rounded-2xl px-3.5 py-1.5 comic-shadow-badge flex items-center gap-1.5 mb-3 comic-speech-tail pointer-events-auto">
        <span class="font-pill font-extrabold uppercase tracking-wide text-xs text-stone-900">WELCOME BACK!</span>
        <span class="text-amber-500 font-bold text-sm">⚡</span>
      </div>
    </div>

    <!-- Right: Close Button -->
    <button type="button" (click)="closeModal.emit()"
      class="pointer-events-auto mb-2 w-10 h-10 rounded-2xl bg-[#fffcf7] hover:bg-amber-100 active:bg-amber-200 border-2 border-[#272421] shadow-tactile flex items-center justify-center text-[#1e1b18] hover:rotate-90 transition-all cursor-pointer"
      aria-label="Close modal">
      <span class="material-symbols-outlined text-xl font-bold">close</span>
    </button>
  </div>

  <!-- Card Body -->
  <div
    class="bg-[#fffdfa] rounded-[32px] comic-border-thick comic-shadow-box px-5 py-7 sm:px-9 sm:py-9 relative overflow-hidden">
    <!-- Header Titles -->
    <div class="text-center mb-6">
      <h1
        class="font-display text-2xl sm:text-4xl uppercase tracking-wider text-stone-900 comic-title-shadow transform -rotate-1 mb-1.5">
        LOG IN TO YOUR ACCOUNT
      </h1>
      <p class="text-stone-600 font-sans font-semibold text-xs sm:text-sm max-w-sm mx-auto">
        Resume your quiz!
      </p>
    </div>

    <!-- Social Login -->
    <div class="mb-5">
      <button
        class="relative w-full bg-[#fffcf7] hover:bg-amber-50 text-stone-900 font-sans font-bold text-sm sm:text-base py-3 px-4 rounded-xl comic-border-input comic-shadow-btn flex items-center justify-center transition cursor-pointer"
        type="button">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-stone-400">
          <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4"></path>
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853"></path>
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
              fill="#FBBC05"></path>
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
              fill="#EA4335"></path>
          </svg>
        </div>
        <span>Sign in with Google</span>
      </button>
    </div>

    <!-- Comic Divider -->
    <div class="relative flex items-center justify-center my-5">
      <div class="w-full border-t-2 border-dashed border-amber-200"></div>
      <span
        class="absolute bg-[#fffdfa] px-3 text-[11px] font-sans font-extrabold uppercase tracking-widest text-amber-800">
        ★ OR ENTER YOUR ACCOUNT ★
      </span>
    </div>

    <!-- LoginForm -->
    <form class="space-y-4" (ngSubmit)="onSubmit()">
      @if (errorMessage()) {
      <div
        class="p-3 bg-orange-50 border-2 border-orange-500 rounded-xl text-orange-900 font-sans text-xs font-bold flex items-center gap-2 shadow-xs">
        <span class="text-base">⚠️</span>
        <span>{{ errorMessage() }}</span>
      </div>
      }

      <!-- Username or Email Field -->
      <div>
        <label class="block font-pill font-bold text-xs uppercase tracking-wider text-stone-900 mb-1.5"
          for="hero-identifier">
          Username or Email <span class="text-orange-600">*</span>
        </label>
        <div class="relative rounded-xl">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-stone-400">
            <svg class="h-4.5 w-4.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path
                d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206"
                stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </div>
          <input
            class="w-full pl-10 pr-4 py-2.5 bg-[#fffcf7] font-sans text-sm font-semibold rounded-xl comic-border-input focus:ring-0 focus:border-amber-600 text-stone-900"
            id="hero-identifier" name="identifier" placeholder="alex.rider@heroacademy.edu" required type="text"
            [value]="identifier()" (input)="identifier.set($any($event.target).value)" />
        </div>
      </div>

      <!-- Password Field -->
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="block font-pill font-bold text-xs uppercase tracking-wider text-stone-900" for="hero-password">
            Password <span class="text-orange-600">*</span>
          </label>
        </div>
        <div class="relative rounded-xl">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-stone-400">
            <svg class="h-4.5 w-4.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </div>
          <input
            class="w-full pl-10 pr-10 py-2.5 bg-[#fffcf7] font-sans text-sm font-semibold rounded-xl comic-border-input focus:ring-0 focus:border-amber-600 text-stone-900"
            id="hero-password" name="password" placeholder="••••••••••••••••" required
            [type]="showPassword() ? 'text' : 'password'" [value]="password()"
            (input)="password.set($any($event.target).value)" />
          <button aria-label="Toggle password visibility"
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-stone-400 hover:text-stone-900 focus:outline-none cursor-pointer"
            type="button" (click)="togglePassword()">
            <svg class="h-4.5 w-4.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
              <path
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Forgot Password -->
      <div class="flex flex-wrap items-center justify-end gap-2 pt-0.5 pb-1">
        <a class="font-pill font-bold text-xs text-amber-700 hover:text-amber-900 underline decoration-2 underline-offset-2"
          href="#">
          Forgot Password?
        </a>
      </div>

      <!-- Submit Button -->
      <div class="pt-1">
        <button
          class="w-full py-3.5 px-6 rounded-2xl comic-border-thick comic-shadow-btn bg-gradient-to-r from-orange-600 via-amber-600 to-amber-500 text-white font-display text-lg sm:text-xl tracking-wider uppercase flex items-center justify-center gap-2 cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed"
          [disabled]="isLoading()" type="submit">
          @if (isLoading()) {
          <span>AUTHENTICATING...</span>
          } @else {
          <span>ENTER THE QUIZZO</span>
          <span class="text-lg">💥</span>
          }
        </button>
      </div>
    </form>

    <!-- Bottom Switcher to Register -->
    <div
      class="mt-6 pt-5 border-t-2 border-dashed border-amber-200 flex flex-wrap items-center justify-center gap-2 text-center">
      <span class="font-sans font-bold text-xs text-stone-900">★ New user ready to join Quizzo?</span>
      <button type="button" (click)="switchToRegister.emit()"
        class="bg-amber-100 hover:bg-amber-200 text-amber-950 font-pill font-extrabold text-xs px-3.5 py-1 rounded-full border-2 border-stone-900 transition inline-flex items-center gap-1.5 shadow-sm cursor-pointer">
        <span>REGISTER NOW</span>
        <span>→</span>
      </button>
      <span class="text-stone-900 font-sans font-bold text-xs">★</span>
    </div>
  </div>
</div>
